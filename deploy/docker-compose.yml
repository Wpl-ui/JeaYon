name: daily-work
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
x-api-build: &api-build
  context: ../server
  dockerfile: Dockerfile
services:
  caddy:
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../app/dist:/srv/app:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      edge:
        ipv4_address: 172.30.240.2
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
  api:
    build: *api-build
    image: daily-work-api:local
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8787"
      APP_ORIGIN: https://jeayon.com
      TRUST_PROXY_CIDR: 172.30.240.2/32
      DATABASE_URL: ${DATABASE_URL:?Set runtime DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      OTP_PEPPER: ${OTP_PEPPER:?Set OTP_PEPPER}
      RATE_LIMIT_HMAC_SECRET: ${RATE_LIMIT_HMAC_SECRET:?Set RATE_LIMIT_HMAC_SECRET}
      EMAIL_PROVIDER: tencent-ses
      SMS_PROVIDER: tencent-sms
      LOG_LEVEL: info
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID:?Set Tencent CAM SecretId}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY:?Set Tencent CAM SecretKey}
      TENCENT_SES_REGION: ${TENCENT_SES_REGION:-ap-guangzhou}
      TENCENT_SES_FROM_EMAIL: ${TENCENT_SES_FROM_EMAIL:?Set approved SES sender}
      TENCENT_SES_TEMPLATE_ID: ${TENCENT_SES_TEMPLATE_ID:?Set SES template}
      TENCENT_SES_SUBJECT: ${TENCENT_SES_SUBJECT:?Set SES subject}
      TENCENT_SMS_REGION: ${TENCENT_SMS_REGION:-ap-guangzhou}
      TENCENT_SMS_SDK_APP_ID: ${TENCENT_SMS_SDK_APP_ID:?Set SMS application ID}
      TENCENT_SMS_SIGN_NAME: ${TENCENT_SMS_SIGN_NAME:?Set approved SMS sign}
      TENCENT_SMS_TEMPLATE_ID: ${TENCENT_SMS_TEMPLATE_ID:?Set SMS template}
      OTP_EMAIL_DAILY_CAP: ${OTP_EMAIL_DAILY_CAP:-1000}
      OTP_SMS_DAILY_CAP: ${OTP_SMS_DAILY_CAP:-500}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      edge:
        ipv4_address: 172.30.240.3
      database: {}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
  postgres:
    image: postgres:16-bookworm@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0
    restart: unless-stopped
    environment:
      POSTGRES_DB: dwa
      POSTGRES_USER: dwa_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set independent bootstrap password}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?Set migrator password}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Set runtime database password}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:?Set backup database password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-dwa.sh:ro
      - ./grant-runtime.sql:/opt/dwa/grant-runtime.sql:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
  migrate:
    profiles: [tools]
    build: *api-build
    image: daily-work-api:local
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set separate migrator URL}
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]
    logging: *logging
  backup:
    profiles: [tools]
    image: postgres:16-bookworm@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0
    entrypoint: ["/bin/bash", "/opt/dwa/backup.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: dwa
      PGUSER: dwa_backup
      PGPASSFILE: /run/secrets/backup.pgpass
      BACKUP_DIR: /backups
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
    volumes:
      - ./backup.sh:/opt/dwa/backup.sh:ro
      - ${BACKUP_PGPASS_FILE:-./backup.pgpass}:/run/secrets/backup.pgpass:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]
    logging: *logging
volumes:
  pgdata:
  caddy_data:
  caddy_config:
networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.240.0/24
  database:
    internal: true
